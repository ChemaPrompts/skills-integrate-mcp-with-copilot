<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div class="teacher-controls">
        <button
          id="teacher-menu-toggle"
          class="teacher-menu-toggle"
          type="button"
          aria-label="Teacher account"
          aria-controls="teacher-menu"
          aria-expanded="false"
        >
          &#128100;
        </button>
        <div id="teacher-menu" class="teacher-menu" hidden>
          <p id="teacher-status" hidden></p>
          <button id="teacher-login-button" type="button">Teacher login</button>
          <button id="teacher-logout-button" type="button" hidden>Log out</button>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="teacher-required" class="info">
          Teacher login is required to register or remove students. Activity
          rosters remain visible to everyone.
        </p>
        <form id="signup-form" hidden>
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="teacher-login-dialog">
      <form id="teacher-login-form">
        <h3>Teacher login</h3>
        <div class="form-group">
          <label for="teacher-username">Username:</label>
          <input id="teacher-username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password:</label>
          <input
            id="teacher-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <p id="teacher-login-error" class="error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="submit">Log in</button>
          <button id="teacher-login-cancel" class="secondary-button" type="button">
            Cancel
          </button>
        </div>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
